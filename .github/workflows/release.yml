# Builds and publishes release artifacts for every platform except iOS.
#
# **iOS is deliberately absent.** A device build needs a signing certificate and
# a provisioning profile from a paid Apple Developer account; without them the
# build cannot produce anything installable. `ios/` stays in the repo — it is
# simply not built here.
#
# Cutting a release:
#     git tag v1.0.0 && git push origin v1.0.0
# A manual run (Actions → Release → Run workflow) builds the same artifacts and
# leaves them on the run page without creating a release, which is the safe way
# to smoke-test the pipeline.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The automatic token needs write access to create the release and upload
# assets to it.
permissions:
  contents: write

# Two runs publishing at once would race for the same asset names.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned to the revision recorded in `.metadata`. `camera` 0.12.1 requires
  # Flutter >= 3.44 / Dart ^3.12, and letting the runner take "latest stable"
  # would make a release depend on the day it happened to run.
  FLUTTER_VERSION: '3.47.6'

jobs:
  # ---------------------------------------------------------------------------
  # Gate. The pure-Dart harness covers the whole protocol stack and needs no
  # engine, so it is the fastest signal; `flutter test` covers the widget and
  # mocktail suites.
  #
  # **These are the same steps `ci.yml` runs on every branch push**, and
  # deliberately so: a tag can point at a commit that never went through a pull
  # request, so this job cannot assume CI already passed. Keep the two step
  # lists in step with each other.
  # ---------------------------------------------------------------------------
  verify:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      # Errors only — see the note in `ci.yml`; the codebase's existing lints
      # have never been triaged, and a gate that is red from day one is a gate
      # nobody reads.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pure Dart harness
        run: dart run tool/verify_pure.dart

      - name: Widget and unit tests
        run: flutter test

  # ---------------------------------------------------------------------------
  # One job per platform. `fail-fast: false` so a Windows-only breakage still
  # produces the Linux and Android artifacts.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: windows
            artifact: windows-x64
          - name: macOS universal
            os: macos-latest
            target: macos
            artifact: macos
          - name: Linux x64
            os: ubuntu-latest
            target: linux
            artifact: linux-x64
          - name: Android APKs
            os: ubuntu-latest
            target: apk
            artifact: android
    env:
      # Read at step level to decide whether a real signing key was supplied.
      # `secrets` is not usable in a step `if`, but `env` is.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            raw="${GITHUB_REF_NAME#v}"
          else
            raw="$(sed -nE 's/^version:[[:space:]]*([^+]+).*/\1/p' pubspec.yaml | head -1)"
          fi
          # Android's `versionName` has to be `x.y.z`; a malformed tag would
          # otherwise fail deep inside Gradle with an unhelpful message.
          if [[ ! "${raw}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '${raw}' is not x.y.z (expected a tag like v1.2.3)"
            exit 1
          fi
          echo "version=${raw}" >> "${GITHUB_OUTPUT}"
          echo "Building ${raw}+${GITHUB_RUN_NUMBER}"

      # Stamping pubspec.yaml is what makes every platform agree on one version:
      # Windows and Linux have no `--build-name` flag, and Android reads
      # versionName/versionCode straight from here. The file is modified in the
      # runner only and is never committed.
      - name: Stamp version into pubspec.yaml
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="${{ steps.version.outputs.version }}+${{ github.run_number }}" \
            '/^version:/ { print "version: " v; next } { print }' \
            pubspec.yaml > pubspec.stamped.yaml
          mv pubspec.stamped.yaml pubspec.yaml
          grep -m1 '^version:' pubspec.yaml

      # ---------------------------------------------------------------------
      # Platform prerequisites
      # ---------------------------------------------------------------------

      # `camera_desktop` links GStreamer directly for its V4L2 backend, and
      # Flutter's Linux desktop needs GTK and ninja. None of it is on the
      # runner image.
      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev liblzma-dev pkg-config ninja-build cmake clang \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good

      - name: Set up Java 17
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `packages` must be given explicitly. At the `v3` tag it defaults to
      # `tools platform-tools`, and the standalone `tools` package was removed
      # from the SDK repository years ago — so `sdkmanager tools` fails with
      # "Failed to find package 'tools'" and takes the whole job down.
      #
      # Packages are split on **spaces**, not commas, so this has to be one
      # space-separated string.
      #
      # The versions are what `flutter.compileSdkVersion` / `targetSdkVersion`
      # (36) and `flutter.ndkVersion` resolve to for this Flutter release —
      # see `packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt`
      # in the SDK. **Bump the NDK here if `FLUTTER_VERSION` above moves.**
      #
      # The NDK is not optional: `build.gradle.kts` sets
      # `ndkVersion = flutter.ndkVersion`, and Flutter's Gradle plugin
      # deliberately configures an empty CMake project to force AGP to resolve
      # it. Flutter can install it mid-build, but doing it here fails fast
      # instead of burying a ~2.7 GB download inside Gradle output.
      #
      # The action accepts the SDK licences itself
      # (`accept-android-sdk-licenses` defaults to true), so no separate
      # `sdkmanager --licenses` step is needed.
      - name: Set up Android SDK
        if: matrix.target == 'apk'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'

      # A real keystore when the secrets are present, so the APKs are
      # publishable. Without them `build.gradle.kts` falls back to the debug
      # key, which installs fine but cannot be uploaded to Play.
      - name: Configure release signing
        if: matrix.target == 'apk' && env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "Release keystore installed."

      - name: Note unsigned build
        if: matrix.target == 'apk' && env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; APKs are debug-signed."

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          if [[ "${{ matrix.target }}" == "apk" ]]; then
            # One APK per ABI: a universal APK carries three copies of the
            # engine and roughly triples the download for a kiosk rollout.
            flutter build apk --release --split-per-abi
          else
            flutter build "${{ matrix.target }}" --release
          fi

      # ---------------------------------------------------------------------
      # Package
      # ---------------------------------------------------------------------
      # Every platform stages its final files into `release/`, and the upload
      # below uses that **one** pattern.
      #
      # Not cosmetic: `upload-artifact` sets the artifact's root to "the least
      # common ancestor of all the search paths" — of the *patterns*, not of
      # what they matched. An earlier version matched `webcam_client-*.zip`,
      # `webcam_client-*.tar.gz` and `dist/*.apk` together, so even in the
      # Android job — where the first two match nothing — the root became the
      # workspace, and the APK was stored as `dist/…apk` inside the artifact.
      # The release job then received `dist/dist/…apk`, and its `dist/*` glob
      # matched only the directory. The APK vanished from the release with no
      # error anywhere. A single uniform pattern makes the root unambiguous.
      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = "webcam_client-$version-windows-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Recurse "build/windows/x64/runner/Release/*" $stage
          Copy-Item README.md $stage
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -Path $stage -DestinationPath "release/$stage.zip"
          Get-ChildItem release

      - name: Package (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stage="webcam_client-${version}-macos"
          mkdir -p "$stage" release
          # `ditto` rather than `zip`: a .app is a bundle of symlinks and
          # extended attributes, and a plain zip flattens the ones the loader
          # needs, producing an app that will not launch.
          ditto "build/macos/Build/Products/Release/webcam_client.app" \
            "$stage/webcam_client.app"
          cp README.md "$stage"
          ditto -c -k --sequesterRsrc --keepParent "$stage" "release/${stage}.zip"
          ls -la release

      - name: Package (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stage="webcam_client-${version}-linux-x64"
          mkdir -p release
          # The bundle is a self-contained tree; keep the layout intact.
          cp -r build/linux/x64/release/bundle "$stage"
          cp README.md "$stage"
          tar -czf "release/${stage}.tar.gz" "$stage"
          ls -la release

      - name: Package (Android)
        if: matrix.target == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p release
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          shopt -u nullglob
          # `nullglob` makes a failed glob an empty array instead of a literal
          # path; without this check the loop would simply not run and the
          # artifact would go up empty.
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::flutter build apk --split-per-abi produced no APKs"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$apk" "release/webcam_client-${version}-android-${abi}.apk"
          done
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # One pattern for every platform. See the note above the packaging
          # steps for why mixing in a subdirectory silently loses files.
          path: release/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Publish. Tag pushes only — a manual run stops at the artifacts above.
  # ---------------------------------------------------------------------------
  release:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Publishing a release that is quietly missing a platform is the worst
      # outcome: it looks fine and nobody notices until someone tries to
      # download. `files: dist/*` matches directories as well as files and the
      # release action skips directories without complaining, so a nested path
      # (`dist/dist/…`) disappears silently. Assert the set instead.
      - name: Verify every platform is present
        shell: bash
        run: |
          set -euo pipefail
          echo "--- downloaded ---"
          ls -la dist
          echo
          missing=()
          for suffix in \
            '-windows-x64.zip' \
            '-macos.zip' \
            '-linux-x64.tar.gz' \
            '-android-arm64-v8a.apk'
          do
            # shellcheck disable=SC2144
            if ! ls dist/*"${suffix}" >/dev/null 2>&1; then
              missing+=("${suffix}")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::release would be incomplete, missing: ${missing[*]}"
            exit 1
          fi
          echo "all four platforms present"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          body: |
            Cross-platform camera edge probe. Builds for **Windows, macOS, Linux
            and Android**; iOS is not built (it needs an Apple Developer
            certificate and provisioning profile).

            ### Assets

            | Platform | File |
            | --- | --- |
            | Windows x64 | `webcam_client-<version>-windows-x64.zip` |
            | macOS (universal) | `webcam_client-<version>-macos.zip` |
            | Linux x64 | `webcam_client-<version>-linux-x64.tar.gz` |
            | Android | `webcam_client-<version>-android-<abi>.apk` |

            ### Before you run it

            The device is a **subordinate** of a `smartclass-webcam-server`
            instance: it registers, then pushes nothing until an operator starts
            a recording from the management plane. So it needs a backend address
            and a device credential pair — both are entered on the device itself
            via the gear button at the bottom-left, no rebuild required.
            `POST /api/devices` on the server issues the pair; **the token is
            returned only once**.

            - **Linux** additionally needs GStreamer at runtime:
              `sudo apt install libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good`
            - **macOS** builds are unsigned, so Gatekeeper blocks the first
              launch. Right-click → Open, or
              `xattr -dr com.apple.quarantine webcam_client.app`.
            - **Windows** builds are unsigned; SmartScreen will warn.
            - **Android** APKs are debug-signed unless the release keystore
              secrets are configured, so they install fine but are not
              Play-publishable.

            Verify with `dart run tool/verify_pure.dart` and `flutter test`.
